[project]
name = "obs"
version = "0.1.0"
description = "Swarm Observatory: trace store, metrics and live feed for the board-stickiness lab"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.2",
  "starlette>=0.41",
  "uvicorn>=0.30",
  "watchfiles>=0.24",
]

[project.scripts]
obs = "obs.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["obs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
